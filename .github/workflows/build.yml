name: build

# 为什么要有这个 workflow:
#
# 开发机上没有 Go 环境,而这个项目的界面 JS 全在 Go 字符串里、
# 解码器全是手写的字节偏移 —— 这两类错误都不会在运行前暴露。
# 没有 CI 的话,"能不能编译"这个问题只能靠人肉读代码回答。
#
# 三个 job 分开而不是串成一个:build 失败时还想看到 vet 的结果,
# 合在一起的话第一步失败就什么都看不到了。
#
# 每个可能失败的步骤都把输出复制进一条 ::error:: annotation。
# 理由:job 日志的下载接口要求仓库 admin 权限,而 annotation 走
# /check-runs/{id}/annotations,公开仓库匿名可读。没有本地 Go 的时候
# 这是唯一能拿到编译/测试错误原文的通道,日志本身看不到。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发:改完代码想立刻知道能不能编译,不必先造一个 commit。
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 跟 go.mod 里的版本对齐。写 '1.22' 而不是 '1.22.5':
          # patch 版本锁死会在 setup-go 撤下某个 patch 时无声地失败。
          go-version: '1.22'
          cache: true

      - name: go build
        run: |
          set +e
          out=$(go build ./... 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            esc=$(printf '%s' "$out" | tail -n 100 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go build 失败::$esc"
          fi
          exit $code

      - name: go vet
        run: |
          set +e
          out=$(go vet ./... 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            esc=$(printf '%s' "$out" | tail -n 100 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go vet 失败::$esc"
          fi
          exit $code

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # node 是界面 JS 检查(uijs_test.go)的前提。没有它那个测试会
      # 自己跳过 —— 跳过也算通过,所以必须显式装上,否则 CI 全绿
      # 但界面脚本从来没被检查过。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: go test
        run: |
          set +e
          out=$(go test ./... -count=1 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            # 只留失败相关的行:annotation 有长度上限,把 ok/no test files
            # 那些成功行塞进去会把真正的报错挤掉。
            esc=$(printf '%s' "$out" | grep -v -E '^(ok|\?)[[:space:]]' | tail -n 120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go test 失败::$esc"
          fi
          exit $code

  # gofmt 单独一个 job:格式问题不该让 build 的红叉盖住真正的编译错误。
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt -l
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化:"
            echo "$out"
            # 连 diff 一起放进 annotation:光有文件名的话,没有 gofmt 的
            # 机器上只能猜是哪一行对不齐,改一次要等一轮 CI。
            diff=$(gofmt -d . | head -c 8000)
            esc=$(printf '%s\n\n%s' "$out" "$diff" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=gofmt 未格式化::$esc"
            echo ""
            echo "本地修复: gofmt -w ."
            exit 1
          fi
